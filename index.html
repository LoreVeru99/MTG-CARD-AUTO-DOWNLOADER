<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101310">
  <meta name="description" content="Scarica immagini PNG delle carte Magic da Scryfall.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.scryfall.com https://*.scryfall.io; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>MTG Image Downloader</title>
  <style>
    :root {
      --bg: #0d100e;
      --panel: #151916;
      --field: #0f1210;
      --line: #333a35;
      --text: #f3f5f3;
      --muted: #9ba39d;
      --accent: #b8ff6a;
      --accent-text: #17200e;
      --error: #ff8d80;
      --ok: #8ee6a9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(620px, 100%);
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
    }

    h1 {
      margin: 0 0 18px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    label { font-size: .84rem; }

    textarea {
      display: block;
      width: 100%;
      min-height: 340px;
      margin-top: 8px;
      padding: 14px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      color: var(--text);
      background: var(--field);
      font: .9rem/1.55 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    textarea:focus,
    button:focus-visible,
    input:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(184, 255, 106, .12);
    }

    .check {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 16px 0;
      cursor: pointer;
      user-select: none;
    }

    .check input {
      width: 17px;
      height: 17px;
      margin: 0;
      accent-color: var(--accent);
    }

    button {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--accent-text);
      background: var(--accent);
      cursor: pointer;
      font: 700 .92rem/1 system-ui, sans-serif;
    }

    button:disabled { cursor: not-allowed; opacity: .5; }

    .secondary {
      margin-bottom: 10px;
      color: var(--text);
      border-color: var(--line);
      background: var(--field);
    }

    #folder {
      min-height: 1.3em;
      margin: 0 0 10px;
      color: var(--muted);
      font-size: .78rem;
    }

    #status {
      min-height: 1.4em;
      margin: 13px 0 0;
      color: var(--muted);
      font-size: .78rem;
      white-space: pre-line;
    }

    #status.error { color: var(--error); }
    #status.ok { color: var(--ok); }

    @media (max-width: 600px) {
      body { place-items: start center; padding: 10px; }
      main { padding: 16px; }
      textarea { min-height: 55vh; }
    }
  </style>
</head>
<body>
  <main>
    <h1>MTG Image Downloader</h1>

    <label for="cards">Carte (una per riga)</label>
    <textarea id="cards" spellcheck="false" autocomplete="off" placeholder="Sol Ring&#10;Lightning Bolt&#10;Delver of Secrets"></textarea>

    <label class="check" for="allFaces">
      <input id="allFaces" type="checkbox" checked>
      <span>Scarica tutte le facce delle carte bifronte</span>
    </label>

    <button id="chooseFolder" class="secondary" type="button">1. Seleziona cartella</button>
    <p id="folder">Nessuna cartella selezionata</p>
    <button id="download" type="button" disabled>2. Scarica carte</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    (() => {
      "use strict";

      const API = "https://api.scryfall.com/cards/named";
      const REQUEST_DELAY_MS = 550;
      const MAX_RETRIES = 3;

      const cardsInput = document.querySelector("#cards");
      const allFacesInput = document.querySelector("#allFaces");
      const chooseFolderButton = document.querySelector("#chooseFolder");
      const downloadButton = document.querySelector("#download");
      const folderStatus = document.querySelector("#folder");
      const status = document.querySelector("#status");

      let running = false;
      let directory = null;

      function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      function cleanLine(line) {
        return line
          .trim()
          .replace(/^\d+\s*[x×]?\s+/i, "")
          .replace(/\s+\[[a-z0-9]+\](?:\s+\{[^}]+\})?\s*$/i, "")
          .replace(/\s+\([a-z0-9]+\)\s+\d+[a-z]?\s*$/i, "")
          .trim();
      }

      function parseCards(text) {
        const names = [];
        const seen = new Set();

        for (const row of text.split(/\r?\n/)) {
          const name = cleanLine(row);
          const key = name.normalize("NFKC").toLocaleLowerCase("en-US");
          if (!name || name.startsWith("#") || name.startsWith("//") || seen.has(key)) continue;
          seen.add(key);
          names.push(name);
        }

        return names;
      }

      function safeName(value) {
        return (value || "carta")
          .normalize("NFKC")
          .replace(/[<>:"/\\|?*\u0000-\u001f]/g, "-")
          .replace(/[. ]+$/g, "")
          .trim()
          .slice(0, 160) || "carta";
      }

      function setStatus(message, type = "") {
        status.textContent = message;
        status.className = type;
      }

      async function fetchRetry(url, options = {}) {
        let lastError;

        for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
          try {
            const response = await fetch(url, options);
            if (response.ok || response.status === 404) return response;

            if (response.status === 429 || response.status >= 500) {
              if (attempt < MAX_RETRIES) {
                const retryAfter = Number(response.headers.get("Retry-After"));
                await wait(Number.isFinite(retryAfter) && retryAfter > 0
                  ? retryAfter * 1000
                  : 1000 * (2 ** attempt));
                continue;
              }
            }

            throw new Error(`HTTP ${response.status}`);
          } catch (error) {
            lastError = error;
            if (attempt < MAX_RETRIES) {
              await wait(800 * (2 ** attempt));
              continue;
            }
          }
        }

        throw lastError || new Error("Errore di rete");
      }

      async function findCard(name) {
        const url = `${API}?exact=${encodeURIComponent(name)}`;
        const response = await fetchRetry(url, {
          headers: { "Accept": "application/json" },
          cache: "no-store"
        });

        if (response.status === 404) return null;
        return response.json();
      }

      function imageList(card, downloadAllFaces) {
        const faces = (card.card_faces || [])
          .filter(face => face.image_uris && face.image_uris.png)
          .map(face => ({ name: face.name || card.name, url: face.image_uris.png }));

        if (faces.length) return downloadAllFaces ? faces : faces.slice(0, 1);
        if (card.image_uris && card.image_uris.png) return [{ name: card.name, url: card.image_uris.png }];
        return [];
      }

      async function writeImage(directory, image, usedNames) {
        const response = await fetchRetry(image.url, {
          headers: { "Accept": "image/png,*/*;q=0.8" },
          cache: "force-cache"
        });
        const blob = await response.blob();
        if (!blob.type.toLowerCase().includes("png")) throw new Error("Formato immagine non valido");

        let stem = safeName(image.name);
        let filename = `${stem}.png`;
        let index = 2;
        while (usedNames.has(filename.toLocaleLowerCase("en-US"))) {
          filename = `${stem} (${index}).png`;
          index++;
        }
        usedNames.add(filename.toLocaleLowerCase("en-US"));

        const fileHandle = await directory.getFileHandle(filename, { create: true });
        const writable = await fileHandle.createWritable();
        try {
          await writable.write(blob);
        } finally {
          await writable.close();
        }
      }

      function setRunning(value) {
        running = value;
        cardsInput.disabled = value;
        allFacesInput.disabled = value;
        chooseFolderButton.disabled = value;
        downloadButton.disabled = value || !directory;
        downloadButton.textContent = value ? "Download in corso…" : "2. Scarica carte";
      }

      function checkEnvironment() {
        if (location.protocol === "file:") {
          setStatus("Questa pagina deve essere aperta dal link HTTPS, non come file locale.", "error");
          return false;
        }

        if (!("showDirectoryPicker" in window) || !window.isSecureContext) {
          setStatus("Usa Chrome, Edge o Opera e apri la pagina tramite HTTPS.", "error");
          return false;
        }

        return true;
      }

      async function chooseFolder() {
        if (running || !checkEnvironment()) return;

        try {
          const selected = await window.showDirectoryPicker({
            id: "mtg-image-downloader",
            mode: "readwrite"
          });

          directory = selected;
          folderStatus.textContent = `Cartella: ${directory.name || "selezionata"}`;
          downloadButton.disabled = false;
          setStatus("Cartella pronta. Premi “Scarica carte”.", "ok");
        } catch (error) {
          if (error.name !== "AbortError") {
            directory = null;
            downloadButton.disabled = true;
            folderStatus.textContent = "Nessuna cartella selezionata";
            setStatus(`Cartella: ${error.message}`, "error");
          }
        }
      }

      async function ensureWritePermission(handle) {
        const options = { mode: "readwrite" };
        if (typeof handle.queryPermission === "function") {
          const state = await handle.queryPermission(options);
          if (state === "granted") return true;
        }
        if (typeof handle.requestPermission === "function") {
          return (await handle.requestPermission(options)) === "granted";
        }
        return true;
      }

      async function run() {
        if (running || !checkEnvironment()) return;

        if (!directory) {
          setStatus("Seleziona prima la cartella.", "error");
          return;
        }

        const names = parseCards(cardsInput.value);
        if (!names.length) {
          setStatus("Inserisci almeno una carta.", "error");
          return;
        }

        try {
          const allowed = await ensureWritePermission(directory);
          if (!allowed) {
            setStatus("Permesso di scrittura non concesso. Seleziona nuovamente la cartella.", "error");
            return;
          }
        } catch (error) {
          setStatus(`Permesso cartella: ${error.message}`, "error");
          return;
        }

        setRunning(true);
        setStatus(`0 / ${names.length}`);

        const usedNames = new Set();
        const problems = [];
        let saved = 0;

        try {
          for (let i = 0; i < names.length; i++) {
            const name = names[i];
            setStatus(`${i + 1} / ${names.length} — ${name}`);

            try {
              const card = await findCard(name);
              if (!card) {
                problems.push(`${name}: non trovata`);
              } else {
                const images = imageList(card, allFacesInput.checked);
                if (!images.length) {
                  problems.push(`${name}: PNG non disponibile`);
                } else {
                  for (const image of images) {
                    await writeImage(directory, image, usedNames);
                    saved++;
                  }
                }
              }
            } catch (error) {
              problems.push(`${name}: ${error.message}`);
            }

            if (i < names.length - 1) await wait(REQUEST_DELAY_MS);
          }

          if (problems.length) {
            setStatus(`${saved} PNG salvati. Errori:\n${problems.join("\n")}`, "error");
          } else {
            setStatus(`${saved} PNG salvati.`, "ok");
          }
        } catch (error) {
          setStatus(`Download interrotto: ${error.message}`, "error");
        } finally {
          setRunning(false);
        }
      }

      chooseFolderButton.addEventListener("click", chooseFolder);
      downloadButton.addEventListener("click", run);
    })();
  </script>
</body>
</html>
