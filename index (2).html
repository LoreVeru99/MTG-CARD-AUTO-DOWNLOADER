<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>MTG Image Downloader</title>
  <style>
    :root {
      --bg: #0b0f0d;
      --panel: #121814;
      --field: #0d120f;
      --line: #2c3830;
      --text: #f3f7f4;
      --muted: #9eaaa2;
      --accent: #a7ff5f;
      --accent-dark: #14200e;
      --danger: #ff7b72;
      --warning: #ffd166;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
    }

    h1 {
      margin: 0 0 22px;
      font-size: 22px;
      line-height: 1.2;
    }

    h2 {
      margin: 0;
      font-size: 15px;
    }

    label, .label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    textarea, input, select, button {
      font: inherit;
    }

    textarea, input[type="search"], input[list], select {
      width: 100%;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--field);
      outline: none;
    }

    textarea:focus, input:focus, select:focus, button:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(167, 255, 95, .13);
    }

    textarea {
      min-height: 230px;
      padding: 13px;
      resize: vertical;
    }

    input[type="search"], input[list], select {
      min-height: 42px;
      padding: 9px 11px;
    }

    section + section { margin-top: 22px; }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
    }

    .count, .hint, #folderName {
      color: var(--muted);
      font-size: 13px;
    }

    .set-box {
      max-height: 220px;
      margin-top: 8px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--field);
    }

    .set-row {
      display: grid;
      grid-template-columns: 22px 1fr auto;
      align-items: center;
      gap: 8px;
      min-height: 39px;
      padding: 7px 10px;
      border-bottom: 1px solid rgba(44, 56, 48, .65);
      cursor: pointer;
    }

    .set-row:last-child { border-bottom: 0; }
    .set-row:hover { background: rgba(167, 255, 95, .05); }
    .set-row input { accent-color: var(--accent); }
    .set-code { color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; }

    .empty {
      padding: 12px;
      color: var(--muted);
    }

    .preference-add {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .preferred-list {
      display: grid;
      gap: 7px;
      margin: 9px 0 0;
      padding: 0;
      list-style: none;
    }

    .preferred-item {
      display: grid;
      grid-template-columns: 32px 1fr auto auto auto;
      align-items: center;
      gap: 7px;
      min-height: 43px;
      padding: 6px 7px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--field);
    }

    .rank {
      color: var(--accent);
      text-align: center;
      font-weight: 800;
    }

    .icon-button, .secondary, .primary {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--text);
      background: var(--field);
      cursor: pointer;
      font-weight: 750;
    }

    .icon-button {
      width: 34px;
      min-height: 32px;
      padding: 0;
      line-height: 1;
    }

    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { cursor: not-allowed; opacity: .45; }

    .primary {
      width: 100%;
      border-color: var(--accent);
      color: #0b1108;
      background: var(--accent);
    }

    .secondary { width: 100%; }

    .actions {
      display: grid;
      gap: 10px;
    }

    #folderName { min-height: 20px; }

    .progress-wrap[hidden] { display: none; }

    progress {
      width: 100%;
      height: 13px;
      border: 0;
      border-radius: 999px;
      overflow: hidden;
      background: var(--field);
    }

    progress::-webkit-progress-bar { background: var(--field); }
    progress::-webkit-progress-value { background: var(--accent); }
    progress::-moz-progress-bar { background: var(--accent); }

    #status {
      min-height: 22px;
      margin-top: 9px;
      white-space: pre-wrap;
    }

    #status.error { color: var(--danger); }
    #status.warning { color: var(--warning); }
    #status.success { color: var(--accent); }

    details {
      margin-top: 8px;
      color: var(--danger);
    }

    details[hidden] { display: none; }

    #errorList {
      max-height: 180px;
      overflow: auto;
      margin-bottom: 0;
      padding-left: 22px;
    }

    @media (max-width: 620px) {
      body { padding: 0; }
      main { padding: 18px; border: 0; border-radius: 0; }
      .preferred-item { grid-template-columns: 28px 1fr repeat(3, 31px); }
      .set-row { grid-template-columns: 22px minmax(0, 1fr) auto; }
    }
  </style>
</head>
<body>
  <main>
    <h1>MTG Image Downloader</h1>

    <section>
      <label for="cardInput">Carte (una per riga)</label>
      <textarea id="cardInput" autocomplete="off" spellcheck="false" placeholder="Sol Ring&#10;4 Lightning Bolt&#10;1x Delver of Secrets"></textarea>
    </section>

    <section aria-labelledby="excludedTitle">
      <div class="section-head">
        <h2 id="excludedTitle">Espansioni escluse</h2>
        <span id="excludedCount" class="count">0 selezionate</span>
      </div>
      <input id="excludedSearch" type="search" placeholder="Cerca espansione o codice" aria-label="Cerca tra le espansioni escluse">
      <div id="excludedSets" class="set-box" role="group" aria-label="Selezione multipla espansioni escluse">
        <div class="empty">Caricamento espansioni…</div>
      </div>
    </section>

    <section aria-labelledby="preferredTitle">
      <div class="section-head">
        <h2 id="preferredTitle">Espansioni preferite</h2>
        <span class="hint">ordine di priorità</span>
      </div>
      <div class="preference-add">
        <input id="preferredInput" list="setOptions" placeholder="Cerca espansione o codice" autocomplete="off" aria-label="Espansione preferita da aggiungere">
        <button id="addPreferred" class="secondary" type="button">Aggiungi</button>
      </div>
      <datalist id="setOptions"></datalist>
      <ol id="preferredList" class="preferred-list"></ol>
    </section>

    <section class="actions">
      <button id="selectFolder" class="secondary" type="button">1. Seleziona cartella</button>
      <div id="folderName">Nessuna cartella selezionata</div>
      <button id="download" class="primary" type="button">2. Scarica carte</button>
    </section>

    <section class="progress-wrap" id="progressWrap" hidden>
      <progress id="progress" value="0" max="1"></progress>
      <div id="status" role="status" aria-live="polite"></div>
      <details id="errorDetails" hidden>
        <summary id="errorSummary">Errori</summary>
        <ul id="errorList"></ul>
      </details>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const API_ROOT = 'https://api.scryfall.com';
      const STORAGE_EXCLUDED = 'mtgImageDownloader.excludedSets.v5';
      const STORAGE_PREFERRED = 'mtgImageDownloader.preferredSets.v5';
      const STORAGE_SET_CACHE = 'mtgImageDownloader.setCache.v5';
      const DOWNLOAD_CONCURRENCY = 6;
      const SEARCH_INTERVAL_MS = 520;
      const GENERAL_INTERVAL_MS = 110;
      const MAX_ORACLE_IDS_PER_QUERY = 18;

      const elements = {
        cardInput: document.getElementById('cardInput'),
        excludedSearch: document.getElementById('excludedSearch'),
        excludedSets: document.getElementById('excludedSets'),
        excludedCount: document.getElementById('excludedCount'),
        preferredInput: document.getElementById('preferredInput'),
        setOptions: document.getElementById('setOptions'),
        addPreferred: document.getElementById('addPreferred'),
        preferredList: document.getElementById('preferredList'),
        selectFolder: document.getElementById('selectFolder'),
        folderName: document.getElementById('folderName'),
        download: document.getElementById('download'),
        progressWrap: document.getElementById('progressWrap'),
        progress: document.getElementById('progress'),
        status: document.getElementById('status'),
        errorDetails: document.getElementById('errorDetails'),
        errorSummary: document.getElementById('errorSummary'),
        errorList: document.getElementById('errorList')
      };

      const state = {
        sets: [],
        setsByCode: new Map(),
        excluded: new Set(readStoredArray(STORAGE_EXCLUDED)),
        preferred: readStoredArray(STORAGE_PREFERRED),
        folderHandle: null,
        busy: false,
        nextApiStart: 0
      };

      state.preferred = state.preferred.filter((code, index, all) =>
        typeof code === 'string' && all.indexOf(code) === index
      );
      for (const code of state.preferred) state.excluded.delete(code);

      function readStoredArray(key) {
        try {
          const value = JSON.parse(localStorage.getItem(key) || '[]');
          return Array.isArray(value) ? value : [];
        } catch {
          return [];
        }
      }

      function savePreferences() {
        localStorage.setItem(STORAGE_EXCLUDED, JSON.stringify([...state.excluded]));
        localStorage.setItem(STORAGE_PREFERRED, JSON.stringify(state.preferred));
      }

      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      function setStatus(message, type = '') {
        elements.status.textContent = message;
        elements.status.className = type;
      }

      function resetProgress() {
        elements.progressWrap.hidden = false;
        elements.progress.value = 0;
        elements.progress.max = 1;
        elements.errorDetails.hidden = true;
        elements.errorList.replaceChildren();
        setStatus('');
      }

      function showErrors(errors) {
        if (!errors.length) {
          elements.errorDetails.hidden = true;
          return;
        }
        elements.errorDetails.hidden = false;
        elements.errorSummary.textContent = `Errori (${errors.length})`;
        elements.errorList.replaceChildren(...errors.map(error => {
          const li = document.createElement('li');
          li.textContent = error;
          return li;
        }));
      }

      async function apiFetch(url, options = {}, intervalMs = GENERAL_INTERVAL_MS) {
        let lastError;
        for (let attempt = 0; attempt < 4; attempt += 1) {
          const wait = Math.max(0, state.nextApiStart - Date.now());
          if (wait) await sleep(wait);
          state.nextApiStart = Date.now() + intervalMs;

          try {
            const response = await fetch(url, {
              ...options,
              headers: {
                Accept: 'application/json',
                ...(options.headers || {})
              }
            });

            if (response.status === 429) {
              const retrySeconds = Number(response.headers.get('Retry-After')) || 30;
              state.nextApiStart = Date.now() + retrySeconds * 1000;
              lastError = new Error('Limite Scryfall raggiunto. Nuovo tentativo automatico.');
              continue;
            }

            if (response.status >= 500 && attempt < 3) {
              lastError = new Error(`Scryfall non disponibile (${response.status})`);
              await sleep(900 * (attempt + 1));
              continue;
            }

            const body = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(body.details || `Errore Scryfall ${response.status}`);
            }
            return body;
          } catch (error) {
            lastError = error;
            if (attempt < 3) await sleep(700 * (attempt + 1));
          }
        }
        throw lastError || new Error('Errore di connessione a Scryfall');
      }

      function normalizeSet(raw) {
        return {
          code: String(raw.code || '').toLowerCase(),
          name: String(raw.name || raw.code || ''),
          releasedAt: raw.released_at || '',
          setType: raw.set_type || ''
        };
      }

      async function loadSets() {
        let cached = [];
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_SET_CACHE) || '{}');
          if (Array.isArray(parsed.data)) cached = parsed.data.map(normalizeSet);
        } catch { /* cache non valida */ }

        if (cached.length) applySets(cached);

        try {
          const response = await apiFetch(`${API_ROOT}/sets`);
          const fresh = (response.data || []).map(normalizeSet).filter(set => set.code && set.name);
          applySets(fresh);
          localStorage.setItem(STORAGE_SET_CACHE, JSON.stringify({ savedAt: Date.now(), data: fresh }));
        } catch (error) {
          if (!cached.length) {
            elements.excludedSets.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
          }
        }
      }

      function applySets(sets) {
        state.sets = [...sets].sort((a, b) =>
          (b.releasedAt || '').localeCompare(a.releasedAt || '') || a.name.localeCompare(b.name, 'it')
        );
        state.setsByCode = new Map(state.sets.map(set => [set.code, set]));
        state.excluded = new Set([...state.excluded].filter(code => state.setsByCode.has(code)));
        state.preferred = state.preferred.filter(code => state.setsByCode.has(code));
        for (const code of state.preferred) state.excluded.delete(code);
        savePreferences();
        renderExcluded();
        renderPreferred();
        renderDatalist();
      }

      function renderDatalist() {
        elements.setOptions.replaceChildren(...state.sets.map(set => {
          const option = document.createElement('option');
          option.value = `${set.name} [${set.code.toUpperCase()}]`;
          return option;
        }));
      }

      function renderExcluded() {
        const query = elements.excludedSearch.value.trim().toLocaleLowerCase('it');
        const visible = state.sets.filter(set =>
          !query || set.name.toLocaleLowerCase('it').includes(query) || set.code.includes(query)
        );

        elements.excludedSets.replaceChildren(...visible.map(set => {
          const label = document.createElement('label');
          label.className = 'set-row';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = state.excluded.has(set.code);
          checkbox.dataset.setCode = set.code;
          checkbox.disabled = state.busy;
          checkbox.addEventListener('change', () => toggleExcluded(set.code, checkbox.checked));

          const name = document.createElement('span');
          name.textContent = set.name;

          const code = document.createElement('span');
          code.className = 'set-code';
          code.textContent = set.code.toUpperCase();

          label.append(checkbox, name, code);
          return label;
        }));

        if (!visible.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = state.sets.length ? 'Nessun risultato' : 'Caricamento espansioni…';
          elements.excludedSets.append(empty);
        }
        elements.excludedCount.textContent = `${state.excluded.size} selezionate`;
      }

      function toggleExcluded(code, checked) {
        if (checked) {
          state.excluded.add(code);
          const index = state.preferred.indexOf(code);
          if (index !== -1) state.preferred.splice(index, 1);
        } else {
          state.excluded.delete(code);
        }
        savePreferences();
        renderPreferred();
        renderExcluded();
      }

      function resolveSetInput(value) {
        const trimmed = value.trim();
        const bracketMatch = trimmed.match(/\[([a-z0-9]+)]\s*$/i);
        if (bracketMatch && state.setsByCode.has(bracketMatch[1].toLowerCase())) {
          return bracketMatch[1].toLowerCase();
        }
        const normalized = trimmed.toLocaleLowerCase('it');
        const exact = state.sets.find(set =>
          set.code === normalized || set.name.toLocaleLowerCase('it') === normalized
        );
        return exact ? exact.code : null;
      }

      function addPreferred() {
        const code = resolveSetInput(elements.preferredInput.value);
        if (!code || state.preferred.includes(code)) return;
        state.excluded.delete(code);
        state.preferred.push(code);
        elements.preferredInput.value = '';
        savePreferences();
        renderPreferred();
        renderExcluded();
      }

      function movePreferred(index, delta) {
        const target = index + delta;
        if (target < 0 || target >= state.preferred.length) return;
        [state.preferred[index], state.preferred[target]] = [state.preferred[target], state.preferred[index]];
        savePreferences();
        renderPreferred();
      }

      function removePreferred(index) {
        state.preferred.splice(index, 1);
        savePreferences();
        renderPreferred();
      }

      function renderPreferred() {
        elements.preferredList.replaceChildren(...state.preferred.map((code, index) => {
          const set = state.setsByCode.get(code) || { name: code.toUpperCase(), code };
          const item = document.createElement('li');
          item.className = 'preferred-item';

          const rank = document.createElement('span');
          rank.className = 'rank';
          rank.textContent = `${index + 1}.`;

          const name = document.createElement('span');
          name.textContent = `${set.name} [${set.code.toUpperCase()}]`;

          const up = iconButton('↑', `Sposta ${set.name} in alto`, index === 0, () => movePreferred(index, -1));
          const down = iconButton('↓', `Sposta ${set.name} in basso`, index === state.preferred.length - 1, () => movePreferred(index, 1));
          const remove = iconButton('×', `Rimuovi ${set.name}`, false, () => removePreferred(index));

          item.append(rank, name, up, down, remove);
          return item;
        }));
      }

      function iconButton(text, label, disabled, onClick) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'icon-button';
        button.textContent = text;
        button.title = label;
        button.setAttribute('aria-label', label);
        button.disabled = disabled || state.busy;
        button.addEventListener('click', onClick);
        return button;
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function parseCardNames(text) {
        const seen = new Set();
        const ignoredHeadings = /^(sideboard|maybeboard|commander|deck|mainboard|companion)\s*:?$/i;
        const result = [];

        for (const rawLine of text.split(/\r?\n/)) {
          let name = rawLine.trim();
          if (!name || name.startsWith('//') || name.startsWith('#') || ignoredHeadings.test(name)) continue;

          name = name
            .replace(/^\s*\d+\s*[x×]?\s+/i, '')
            .replace(/\s+\([A-Z0-9]+\)\s+[A-Z0-9-]+\s*$/i, '')
            .replace(/\s+\*F\*\s*$/i, '')
            .trim();

          if (!name) continue;
          const key = name.toLocaleLowerCase('en');
          if (!seen.has(key)) {
            seen.add(key);
            result.push(name);
          }
        }
        return result;
      }

      function chunk(items, size) {
        const result = [];
        for (let index = 0; index < items.length; index += size) {
          result.push(items.slice(index, index + size));
        }
        return result;
      }

      async function resolveCards(names, update) {
        const found = [];
        const missing = [];
        const batches = chunk(names, 75);

        for (let batchIndex = 0; batchIndex < batches.length; batchIndex += 1) {
          const batch = batches[batchIndex];
          update(`Ricerca carte ${batchIndex + 1}/${batches.length}…`);
          const response = await apiFetch(`${API_ROOT}/cards/collection`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifiers: batch.map(name => ({ name })) })
          }, SEARCH_INTERVAL_MS);

          const notFound = new Set((response.not_found || [])
            .map(item => String(item.name || '').toLocaleLowerCase('en')));
          let dataIndex = 0;

          for (const requested of batch) {
            if (notFound.has(requested.toLocaleLowerCase('en'))) {
              missing.push(requested);
              continue;
            }
            const card = response.data?.[dataIndex++];
            if (card) found.push({ requested, card });
            else missing.push(requested);
          }
        }

        return { found, missing };
      }

      function makeOracleBatches(records) {
        const unique = [];
        const seen = new Set();
        for (const record of records) {
          const id = record.card.oracle_id;
          if (id && !seen.has(id)) {
            seen.add(id);
            unique.push(id);
          }
        }
        return chunk(unique, MAX_ORACLE_IDS_PER_QUERY);
      }

      async function fetchAllPages(url) {
        const cards = [];
        let next = url;
        while (next) {
          const page = await apiFetch(next, {}, SEARCH_INTERVAL_MS);
          cards.push(...(page.data || []));
          next = page.has_more ? page.next_page : null;
        }
        return cards;
      }

      async function fetchPrints(records, update) {
        const byOracle = new Map();
        const batches = makeOracleBatches(records);

        for (let index = 0; index < batches.length; index += 1) {
          const ids = batches[index];
          update(`Selezione stampe ${index + 1}/${batches.length}…`);
          const query = `(${ids.map(id => `oracleid:${id}`).join(' OR ')})`;
          const params = new URLSearchParams({
            q: query,
            unique: 'prints',
            order: 'released',
            dir: 'desc',
            include_extras: 'true'
          });

          let cards;
          try {
            cards = await fetchAllPages(`${API_ROOT}/cards/search?${params}`);
          } catch {
            cards = [];
            for (const id of ids) {
              const source = records.find(record => record.card.oracle_id === id)?.card;
              if (!source?.prints_search_uri) continue;
              try {
                cards.push(...await fetchAllPages(source.prints_search_uri));
              } catch { /* la stampa risolta resta disponibile come fallback */ }
            }
          }

          for (const card of cards) {
            if (!card.oracle_id) continue;
            if (!byOracle.has(card.oracle_id)) byOracle.set(card.oracle_id, []);
            byOracle.get(card.oracle_id).push(card);
          }
        }
        return byOracle;
      }

      function hasPng(card) {
        return Boolean(card?.image_uris?.png || card?.card_faces?.some(face => face.image_uris?.png));
      }

      function collectorNumberValue(value) {
        const match = String(value || '').match(/^\d+/);
        return match ? Number(match[0]) : Number.MAX_SAFE_INTEGER;
      }

      function comparePrints(a, b) {
        const date = String(b.released_at || '').localeCompare(String(a.released_at || ''));
        if (date) return date;
        if (Boolean(a.digital) !== Boolean(b.digital)) return a.digital ? 1 : -1;
        if (Boolean(a.promo) !== Boolean(b.promo)) return a.promo ? 1 : -1;
        if (Boolean(a.highres_image) !== Boolean(b.highres_image)) return a.highres_image ? -1 : 1;
        return collectorNumberValue(a.collector_number) - collectorNumberValue(b.collector_number);
      }

      function selectPrinting(record, prints) {
        const candidates = [...(prints || [])].filter(hasPng).sort(comparePrints);
        if (!candidates.length) return record.card;

        for (const preferredCode of state.preferred) {
          const preferred = candidates.find(card => card.set === preferredCode);
          if (preferred) return preferred;
        }

        const allowed = candidates.find(card => !state.excluded.has(card.set));
        return allowed || candidates[0];
      }

      function sanitizeFileName(value) {
        const safe = String(value || 'carta')
          .replace(/[<>:"/\\|?*\u0000-\u001F]/g, '_')
          .replace(/[. ]+$/g, '')
          .trim();
        return (safe || 'carta').slice(0, 150);
      }

      function imageJobs(record, selected) {
        const faces = selected.card_faces || [];
        if (selected.image_uris?.png) {
          return [{
            requested: record.requested,
            setCode: selected.set,
            url: selected.image_uris.png,
            fileName: `${sanitizeFileName(selected.name)}.png`
          }];
        }

        const available = faces.filter(face => face.image_uris?.png);
        return available.map((face, index) => ({
          requested: record.requested,
          setCode: selected.set,
          url: face.image_uris.png,
          fileName: `${sanitizeFileName(selected.name)} - ${index + 1} - ${sanitizeFileName(face.name)}.png`
        }));
      }

      function ensureUniqueFileNames(jobs) {
        const used = new Map();
        return jobs.map(job => {
          const key = job.fileName.toLocaleLowerCase('en');
          const count = used.get(key) || 0;
          used.set(key, count + 1);
          if (!count) return job;
          const stem = job.fileName.replace(/\.png$/i, '');
          return { ...job, fileName: `${stem} - ${String(job.setCode || '').toUpperCase()}-${count + 1}.png` };
        });
      }

      async function ensureWritePermission(handle) {
        if (!handle?.queryPermission) return true;
        const options = { mode: 'readwrite' };
        if (await handle.queryPermission(options) === 'granted') return true;
        return (await handle.requestPermission(options)) === 'granted';
      }

      async function selectFolder() {
        if (!window.isSecureContext || typeof window.showDirectoryPicker !== 'function') {
          resetProgress();
          setStatus('Selezione cartella non supportata. Apri il sito HTTPS con Chrome o Edge.', 'error');
          return;
        }

        try {
          const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
          if (!await ensureWritePermission(handle)) throw new Error('Permesso di scrittura non concesso');
          state.folderHandle = handle;
          elements.folderName.textContent = `Cartella: ${handle.name}`;
        } catch (error) {
          if (error.name !== 'AbortError') {
            resetProgress();
            setStatus(error.message, 'error');
          }
        }
      }

      async function downloadBlob(url) {
        let lastError;
        for (let attempt = 0; attempt < 3; attempt += 1) {
          try {
            const response = await fetch(url, { cache: 'force-cache' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.blob();
          } catch (error) {
            lastError = error;
            if (attempt < 2) await sleep(500 * (2 ** attempt));
          }
        }
        throw lastError || new Error('Download non riuscito');
      }

      async function writeJob(job) {
        const blob = await downloadBlob(job.url);
        const fileHandle = await state.folderHandle.getFileHandle(job.fileName, { create: true });
        const writable = await fileHandle.createWritable();
        try {
          await writable.write(blob);
        } finally {
          await writable.close();
        }
      }

      async function runPool(jobs, workerCount, onProgress) {
        let nextIndex = 0;
        const errors = [];
        let completed = 0;
        let saved = 0;

        async function worker() {
          while (true) {
            const index = nextIndex++;
            if (index >= jobs.length) return;
            const job = jobs[index];
            try {
              await writeJob(job);
              saved += 1;
            } catch (error) {
              errors.push(`${job.fileName}: ${error.message}`);
            } finally {
              completed += 1;
              onProgress(completed, saved, jobs.length);
            }
          }
        }

        const workers = Array.from({ length: Math.min(workerCount, jobs.length) }, () => worker());
        await Promise.all(workers);
        return { errors, saved };
      }

      function setBusy(busy) {
        state.busy = busy;
        elements.cardInput.disabled = busy;
        elements.excludedSearch.disabled = busy;
        elements.preferredInput.disabled = busy;
        elements.addPreferred.disabled = busy;
        elements.selectFolder.disabled = busy;
        elements.download.disabled = busy;
        renderExcluded();
        renderPreferred();
      }

      async function downloadCards() {
        resetProgress();
        const errors = [];
        const names = parseCardNames(elements.cardInput.value);

        if (!names.length) {
          setStatus('Inserisci almeno una carta.', 'error');
          return;
        }
        if (!state.folderHandle) {
          setStatus('Seleziona prima la cartella.', 'error');
          return;
        }
        if (!await ensureWritePermission(state.folderHandle)) {
          setStatus('Permesso di scrittura non concesso.', 'error');
          return;
        }

        setBusy(true);
        try {
          const { found, missing } = await resolveCards(names, message => setStatus(message));
          errors.push(...missing.map(name => `${name}: non trovata`));

          const printsByOracle = await fetchPrints(found, message => setStatus(message));
          const jobs = [];
          for (const record of found) {
            const selected = selectPrinting(record, printsByOracle.get(record.card.oracle_id));
            const cardJobs = imageJobs(record, selected);
            if (cardJobs.length) jobs.push(...cardJobs);
            else errors.push(`${record.requested}: PNG non disponibile`);
          }

          const uniqueJobs = ensureUniqueFileNames(jobs);
          if (!uniqueJobs.length) {
            setStatus('Nessun PNG da scaricare.', 'error');
            showErrors(errors);
            return;
          }

          elements.progress.max = uniqueJobs.length;
          setStatus(`Download 0/${uniqueJobs.length}…`);
          const result = await runPool(uniqueJobs, DOWNLOAD_CONCURRENCY, (completed, saved, total) => {
            elements.progress.value = completed;
            setStatus(`Download ${completed}/${total} · ${saved} salvati`);
          });
          errors.push(...result.errors);

          showErrors(errors);
          const type = errors.length ? 'warning' : 'success';
          setStatus(`${result.saved} PNG salvati${errors.length ? ` · ${errors.length} errori` : ''}`, type);
        } catch (error) {
          errors.push(error.message);
          showErrors(errors);
          setStatus(error.message, 'error');
        } finally {
          setBusy(false);
        }
      }

      elements.excludedSearch.addEventListener('input', renderExcluded);
      elements.addPreferred.addEventListener('click', addPreferred);
      elements.preferredInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          addPreferred();
        }
      });
      elements.selectFolder.addEventListener('click', selectFolder);
      elements.download.addEventListener('click', downloadCards);

      window.MTGDownloaderTest = Object.freeze({
        parseCardNames,
        selectPrinting: (record, prints, preferred = [], excluded = []) => {
          const oldPreferred = state.preferred;
          const oldExcluded = state.excluded;
          state.preferred = [...preferred];
          state.excluded = new Set(excluded);
          try { return selectPrinting(record, prints); }
          finally {
            state.preferred = oldPreferred;
            state.excluded = oldExcluded;
          }
        },
        imageJobs,
        ensureUniqueFileNames,
        comparePrints,
        sanitizeFileName
      });

      renderExcluded();
      renderPreferred();
      loadSets();
    })();
  </script>
</body>
</html>
